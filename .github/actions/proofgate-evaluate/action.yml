name: ProofGate Evaluate
description: Build an Entire-backed Change Passport and enforce a deterministic CI decision.

inputs:
  repository-id:
    description: Approved non-secret identifier for the repository.
    required: true
  repository-path:
    description: Target repository path, relative to GITHUB_WORKSPACE.
    default: .
  commit:
    description: Commit or revision to evaluate.
    default: HEAD
  checkpoint:
    description: Entire checkpoint ID, or auto to read the commit trailer.
    default: auto
  test-report:
    description: Optional ProofGate test-report JSON, relative to GITHUB_WORKSPACE.
    default: ""
  repository-opted-in:
    description: Confirm this repository opted in to governed ProofGate processing.
    default: "false"
  repository-is-public:
    description: Mark the repository as public.
    default: "false"
  sensitive-prefixes:
    description: Optional comma-separated sensitive path prefixes.
    default: ""
  denied-prefixes:
    description: Optional comma-separated paths that can never be auto-approved.
    default: ""
  graph-mode:
    description: Entire Graph impact analysis mode (off, auto, or required).
    default: auto
  fail-on:
    description: Fail on approval-required, warn, or never.
    default: approval-required
  databricks-mode:
    description: Use Databricks for off, history, export, or roundtrip processing.
    default: off
  databricks-required:
    description: Fail when a requested Databricks operation is unavailable.
    default: "false"
  result-path:
    description: Machine-readable result path, relative to GITHUB_WORKSPACE.
    default: proofgate-result.json

outputs:
  decision:
    description: Deterministic automated verdict (PASS, WARN, or APPROVAL_REQUIRED).
    value: ${{ steps.gate.outputs.decision }}
  enforcement-status:
    description: Effective CI state, including AWAITING_APPROVAL or a human decision.
    value: ${{ steps.gate.outputs.enforcement_status }}
  risk-score:
    description: Deterministic risk score from 0 to 100.
    value: ${{ steps.gate.outputs.risk_score }}
  hard-stops:
    description: Number of non-negotiable review blockers.
    value: ${{ steps.gate.outputs.hard_stops }}
  checkpoint-id:
    description: Entire checkpoint attached to the evaluated commit.
    value: ${{ steps.gate.outputs.checkpoint_id }}
  result-path:
    description: Path to the generated machine-readable result.
    value: ${{ steps.gate.outputs.result_path }}
  databricks-status:
    description: OFF, HISTORY_LOADED, EXPORTED, ROUNDTRIP_COMPLETE, or DEGRADED.
    value: ${{ steps.gate.outputs.databricks_status }}
  impact-source:
    description: Entire Graph version or the labelled git-path fallback.
    value: ${{ steps.gate.outputs.impact_source }}
  impact-complete:
    description: Whether semantic analysis covered all changed files without warnings.
    value: ${{ steps.gate.outputs.impact_complete }}
  max-dependents:
    description: Largest dependent count reported for a changed entity.
    value: ${{ steps.gate.outputs.max_dependents }}

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version-file: ${{ github.action_path }}/../../../proofgate/go.mod
        cache: false

    - name: Install Entire CLI
      shell: bash
      run: |
        install_dir="$RUNNER_TEMP/proofgate-bin"
        mkdir -p "$install_dir"
        GOBIN="$install_dir" go install github.com/entireio/cli/cmd/entire@v0.10.5
        echo "$install_dir" >> "$GITHUB_PATH"

    - name: Install Entire Graph
      if: inputs.graph-mode != 'off'
      shell: bash
      env:
        PROOFGATE_GRAPH_MODE: ${{ inputs.graph-mode }}
      run: |
        if ! entire plugin install graph --pin v0.4.0 --yes; then
          if [[ "$PROOFGATE_GRAPH_MODE" == "required" ]]; then
            echo "Entire Graph is required but installation failed." >&2
            exit 1
          fi
          echo "Entire Graph installation failed; ProofGate will label and use its git-path fallback." >&2
        fi

    - id: gate
      name: Evaluate governed change
      shell: bash
      env:
        PROOFGATE_REPOSITORY_ID: ${{ inputs.repository-id }}
        PROOFGATE_REPOSITORY_PATH: ${{ inputs.repository-path }}
        PROOFGATE_COMMIT: ${{ inputs.commit }}
        PROOFGATE_CHECKPOINT: ${{ inputs.checkpoint }}
        PROOFGATE_TEST_REPORT: ${{ inputs.test-report }}
        PROOFGATE_OPTED_IN: ${{ inputs.repository-opted-in }}
        PROOFGATE_IS_PUBLIC: ${{ inputs.repository-is-public }}
        PROOFGATE_SENSITIVE_PREFIXES: ${{ inputs.sensitive-prefixes }}
        PROOFGATE_DENIED_PREFIXES: ${{ inputs.denied-prefixes }}
        PROOFGATE_GRAPH_MODE: ${{ inputs.graph-mode }}
        PROOFGATE_FAIL_ON: ${{ inputs.fail-on }}
        PROOFGATE_DATABRICKS_MODE: ${{ inputs.databricks-mode }}
        PROOFGATE_DATABRICKS_REQUIRED: ${{ inputs.databricks-required }}
        PROOFGATE_RESULT_PATH: ${{ inputs.result-path }}
      run: |
        args=(
          ci-gate
          --repo "$GITHUB_WORKSPACE/$PROOFGATE_REPOSITORY_PATH"
          --repo-id "$PROOFGATE_REPOSITORY_ID"
          --commit "$PROOFGATE_COMMIT"
          --checkpoint "$PROOFGATE_CHECKPOINT"
          --repo-opted-in="$PROOFGATE_OPTED_IN"
          --repo-public="$PROOFGATE_IS_PUBLIC"
          --sensitive-prefixes "$PROOFGATE_SENSITIVE_PREFIXES"
          --denied-prefixes "$PROOFGATE_DENIED_PREFIXES"
          --graph-mode "$PROOFGATE_GRAPH_MODE"
          --fail-on "$PROOFGATE_FAIL_ON"
          --databricks-mode "$PROOFGATE_DATABRICKS_MODE"
          --databricks-required="$PROOFGATE_DATABRICKS_REQUIRED"
          --result "$GITHUB_WORKSPACE/$PROOFGATE_RESULT_PATH"
        )
        if [[ -n "$PROOFGATE_TEST_REPORT" ]]; then
          args+=(--tests "$GITHUB_WORKSPACE/$PROOFGATE_TEST_REPORT")
        fi
        cd "$GITHUB_ACTION_PATH/../../../proofgate"
        go run ./cmd/proofgate "${args[@]}"
