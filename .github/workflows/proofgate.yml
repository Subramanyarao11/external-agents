name: ProofGate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Exact commit SHA to re-evaluate after Control Room approval
        required: false
        type: string

concurrency:
  # One live run per PR; a newer head commit cancels the superseded evaluation.
  # Manual approval re-runs remain isolated by their exact candidate SHA.
  group: proofgate-${{ github.repository }}-${{ github.event.pull_request.number || inputs.candidate_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the candidate change
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          # A pull_request ref is a synthetic merge commit. ProofGate must inspect
          # the contributor's checkpointed head commit instead.
          ref: ${{ inputs.candidate_ref || github.event.pull_request.head.sha || github.sha }}

      - name: Fetch Entire checkpoint evidence
        shell: bash
        run: git fetch origin '+refs/heads/entire/*:refs/remotes/origin/entire/*'

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: proofgate/go.mod
          cache: false

      - name: Run tests and produce allowlisted evidence
        shell: bash
        run: |
          cd proofgate
          go run gotest.tools/gotestsum@v1.13.0 \
            --junitfile "$GITHUB_WORKSPACE/proofgate-junit.xml" -- ./...
          go run ./cmd/proofgate junit-report \
            --junit proofgate="$GITHUB_WORKSPACE/proofgate-junit.xml" \
            --output "$GITHUB_WORKSPACE/proofgate-test-report.json"

      - id: proofgate
        name: Evaluate the change
        uses: ./.github/actions/proofgate-evaluate
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_SQL_WAREHOUSE_ID: ${{ secrets.DATABRICKS_SQL_WAREHOUSE_ID }}
          PROOFGATE_DATABRICKS_CATALOG: ${{ secrets.PROOFGATE_DATABRICKS_CATALOG }}
          PROOFGATE_DATABRICKS_SCHEMA: ${{ secrets.PROOFGATE_DATABRICKS_SCHEMA }}
        with:
          repository-id: ${{ github.repository }}
          commit: ${{ inputs.candidate_ref || github.event.pull_request.head.sha || github.sha }}
          repository-opted-in: "true"
          test-report: proofgate-test-report.json
          denied-prefixes: payments/production,infra/production
          graph-mode: required
          fail-on: approval-required
          databricks-mode: roundtrip
          databricks-required: "false"

      - name: Publish the PR evidence report
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 proofgate/scripts/publish_pr_report.py \
            --result proofgate-result.json \
            --repository "${{ github.repository }}" \
            --pull-request "${{ github.event.pull_request.number }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Preserve the Change Passport
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: proofgate-${{ github.run_id }}
          path: proofgate-result.json
          if-no-files-found: error
          retention-days: 14
