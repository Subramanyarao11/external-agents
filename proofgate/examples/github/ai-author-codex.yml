name: ProofGate AI author — Codex

on:
  workflow_dispatch:
    inputs:
      task:
        description: Small, reviewable coding task for Codex
        required: true
        type: string
      model:
        description: Optional Codex model identifier
        required: false
        default: ""
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  author:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CAPTURE_SESSION_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-codex
      TASK_PROMPT: ${{ inputs.task }}
      REQUESTED_MODEL: ${{ inputs.model }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: proofgate/go.mod
          cache: false

      - name: Install Entire and the GitHub Actions adapter
        shell: bash
        run: |
          install_dir="$RUNNER_TEMP/proofgate-bin"
          mkdir -p "$install_dir"
          GOBIN="$install_dir" go install github.com/entireio/cli/cmd/entire@v0.10.5
          (cd agents/entire-agent-github-actions && \
            go build -o "$install_dir/entire-agent-github-actions" \
              ./cmd/entire-agent-github-actions)
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Enable Entire capture
        shell: bash
        run: |
          entire enable --agent github-actions --yes --project --telemetry=false
          git restore --worktree -- .entire/settings.json .github/actions/entire-proofgate/action.yml

      - name: Start governed capture
        uses: ./.github/actions/entire-proofgate
        with:
          mode: begin
          provider: codex
          model: ${{ inputs.model }}
          session_id: ${{ env.CAPTURE_SESSION_ID }}
          prompt: ${{ inputs.task }}

      - id: codex
        name: Let Codex implement the task
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: |
            Implement this small, reviewable task in the checked-out repository:
            ${{ inputs.task }}

            Do not commit, push, open a pull request, or modify .github, .entire,
            or credential files. Run the narrowest relevant test before finishing.
          model: ${{ inputs.model }}
          codex-home: ${{ runner.temp }}/proofgate-codex
          output-file: ${{ runner.temp }}/proofgate-codex-final.txt
          permission-profile: ":workspace"
          safety-strategy: drop-sudo

      - id: trace
        name: Locate the private Codex rollout
        if: always()
        shell: bash
        run: |
          execution_file=$(find "$RUNNER_TEMP/proofgate-codex/sessions" -type f -name 'rollout-*.jsonl' -print 2>/dev/null | sort | tail -n 1)
          if [[ -z "$execution_file" ]]; then
            echo "Codex did not produce a rollout file." >&2
            exit 1
          fi
          echo "execution_file=$execution_file" >> "$GITHUB_OUTPUT"

      - name: Finish governed capture
        if: always() && steps.trace.outputs.execution_file != ''
        uses: ./.github/actions/entire-proofgate
        with:
          mode: finish
          provider: codex
          model: ${{ inputs.model }}
          session_id: ${{ env.CAPTURE_SESSION_ID }}
          prompt: ${{ inputs.task }}
          execution_file: ${{ steps.trace.outputs.execution_file }}

      - name: Commit the governed change
        shell: bash
        env:
          AUTHOR_BRANCH: proofgate/codex-${{ github.run_id }}
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Codex completed without changing the repository." >&2
            exit 1
          fi
          git config user.name "ProofGate Codex"
          git config user.email "proofgate-codex@users.noreply.github.com"
          git switch -c "$AUTHOR_BRANCH"
          git add -A
          git commit -m "feat: governed Codex change"
          git push --set-upstream origin "$AUTHOR_BRANCH"

      - name: Open the ProofGate pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHOR_BRANCH: proofgate/codex-${{ github.run_id }}
        run: |
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$AUTHOR_BRANCH" \
            --title "Governed Codex change #${{ github.run_id }}" \
            --body "Created by Codex in GitHub Actions and captured by Entire for ProofGate evaluation."

      - name: Dispatch ProofGate for the authored branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHOR_BRANCH: proofgate/codex-${{ github.run_id }}
        run: gh workflow run proofgate.yml --ref "$AUTHOR_BRANCH"
