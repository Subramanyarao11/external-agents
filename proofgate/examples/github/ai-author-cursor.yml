name: ProofGate AI author — Cursor

on:
  workflow_dispatch:
    inputs:
      task:
        description: Small, reviewable coding task for Cursor Agent
        required: true
        type: string
      model:
        description: Optional Cursor model identifier
        required: false
        default: ""
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  author:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CAPTURE_SESSION_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-cursor
      TASK_PROMPT: ${{ inputs.task }}
      REQUESTED_MODEL: ${{ inputs.model }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: proofgate/go.mod
          cache: false

      - name: Install Entire and the GitHub Actions adapter
        shell: bash
        run: |
          install_dir="$RUNNER_TEMP/proofgate-bin"
          mkdir -p "$install_dir"
          GOBIN="$install_dir" go install github.com/entireio/cli/cmd/entire@v0.10.5
          (cd agents/entire-agent-github-actions && \
            go build -o "$install_dir/entire-agent-github-actions" \
              ./cmd/entire-agent-github-actions)
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Install Cursor Agent CLI
        shell: bash
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Enable Entire capture
        shell: bash
        run: |
          entire enable --agent github-actions --yes --project --telemetry=false
          git restore --worktree -- .entire/settings.json .github/actions/entire-proofgate/action.yml

      - name: Start governed capture
        uses: ./.github/actions/entire-proofgate
        with:
          mode: begin
          provider: cursor
          model: ${{ inputs.model }}
          session_id: ${{ env.CAPTURE_SESSION_ID }}
          prompt: ${{ inputs.task }}

      - name: Let Cursor Agent implement the task
        shell: bash
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          args=(
            -p
            --force
            --output-format stream-json
          )
          if [[ -n "$REQUESTED_MODEL" ]]; then
            args+=(--model "$REQUESTED_MODEL")
          fi
          governed_prompt=$(printf '%s\n\n%s' \
            "Implement only this small, reviewable task: $TASK_PROMPT" \
            "Do not commit, push, open a pull request, or modify .github, .entire, or credential files. Run the narrowest relevant test before finishing.")
          cursor-agent "${args[@]}" "$governed_prompt" > "$RUNNER_TEMP/proofgate-cursor-stream.jsonl"

      - id: trace
        name: Confirm the private Cursor stream
        if: always()
        shell: bash
        run: |
          execution_file="$RUNNER_TEMP/proofgate-cursor-stream.jsonl"
          if [[ ! -s "$execution_file" ]]; then
            echo "Cursor did not produce a stream-json trace." >&2
            exit 1
          fi
          echo "execution_file=$execution_file" >> "$GITHUB_OUTPUT"

      - name: Finish governed capture
        if: always() && steps.trace.outputs.execution_file != ''
        uses: ./.github/actions/entire-proofgate
        with:
          mode: finish
          provider: cursor
          model: ${{ inputs.model }}
          session_id: ${{ env.CAPTURE_SESSION_ID }}
          prompt: ${{ inputs.task }}
          execution_file: ${{ steps.trace.outputs.execution_file }}

      - name: Commit the governed change
        shell: bash
        env:
          AUTHOR_BRANCH: proofgate/cursor-${{ github.run_id }}
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Cursor completed without changing the repository." >&2
            exit 1
          fi
          git config user.name "ProofGate Cursor"
          git config user.email "proofgate-cursor@users.noreply.github.com"
          git switch -c "$AUTHOR_BRANCH"
          git add -A
          git commit -m "feat: governed Cursor change"
          git push --set-upstream origin "$AUTHOR_BRANCH"

      - name: Open the ProofGate pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHOR_BRANCH: proofgate/cursor-${{ github.run_id }}
        run: |
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$AUTHOR_BRANCH" \
            --title "Governed Cursor change #${{ github.run_id }}" \
            --body "Created by Cursor Agent in GitHub Actions and captured by Entire for ProofGate evaluation."

      - name: Dispatch ProofGate for the authored branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHOR_BRANCH: proofgate/cursor-${{ github.run_id }}
        run: gh workflow run proofgate.yml --ref "$AUTHOR_BRANCH"
