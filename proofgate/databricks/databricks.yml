bundle:
  name: entire-proofgate

variables:
  catalog:
    description: Unity Catalog catalog for ProofGate evidence
    default: main
  schema:
    description: Unity Catalog schema for ProofGate evidence
    default: proofgate_dev
  warehouse_id:
    description: Existing serverless SQL warehouse ID

resources:
  schemas:
    proofgate:
      name: ${var.schema}
      catalog_name: ${var.catalog}
      comment: Governed, allowlisted ProofGate evidence and historical features

  jobs:
    proofgate_prepare:
      name: proofgate-prepare-${bundle.target}
      max_concurrent_runs: 1
      tasks:
        - task_key: setup_tables
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ./sql/001_setup.sql
            parameters:
              catalog_name: ${var.catalog}
              schema_name: ${var.schema}
        - task_key: transform_evidence
          depends_on:
            - task_key: setup_tables
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ./sql/002_transform.sql
            parameters:
              catalog_name: ${var.catalog}
              schema_name: ${var.schema}

targets:
  dev:
    default: true
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  demo:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
